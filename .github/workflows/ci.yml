name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest
        env:
          MINIO_ROOT_USER: dummy
          MINIO_ROOT_PASSWORD: dummy

  dbt-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt_earthquakes
    steps:
      - uses: actions/checkout@v4
      - name: Build dbt image
        run: docker build -t dbt-earthquakes .
      - name: dbt parse
        run: docker run dbt-earthquakes parse --no-partial-parse