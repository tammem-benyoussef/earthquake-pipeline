name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest
        env:
          MINIO_ROOT_USER: dummy
          MINIO_ROOT_PASSWORD: dummy

  dbt-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt_earthquakes
    steps:
      - uses: actions/checkout@v4
      - name: Build dbt image
        run: docker build -t dbt-earthquakes .
      - name: Create dummy profiles.yml for parsing
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          earthquake_pipeline:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                user: dummy
                password: dummy
                port: 5432
                dbname: dummy
                schema: staging
                threads: 1
          EOF
      - name: dbt parse
        run: docker run -v ~/.dbt:/root/.dbt dbt-earthquakes parse --no-partial-parse
  
  airflow-dag-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install apache-airflow==2.10.5
      - run: python -c "from airflow.models import DagBag; db = DagBag(dag_folder='airflow/dags', include_examples=False); assert not db.import_errors, db.import_errors"